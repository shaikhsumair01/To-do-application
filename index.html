<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The head section including meta tags and the link of the external sources -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>To do list</title>
</head>
<body>
    <!-- Container class contains the text input for the user to provide the inputs which gets stored in the list  -->
    <div class="container">
    <!-- Header class for aligning h1 and the icon   -->
    <div class="header"> 
        <h1>To-Do List</h1> 
        <i class="fa fa-flag flag" style = "font-size: 20px;"></i>
    </div>  
    <!-- fields to align the field inputs taking the information (text box and submit button) -->
    <div class="fields"> 
    <input type="text" class="field-input">
    <button class="field-btn" type="submit">Add</button> 
    </div>
    </div>
   
<script src="main.js"></script>
</body>
</html>
